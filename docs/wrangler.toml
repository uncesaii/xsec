# Cloudflare Pages config for the xsec docs site.
# Mirrors the xsec-www setup (parent-company landing) so the two deploy the
# same way. Project name matches the actual CF Pages project; build output is
# Astro's `dist`. Deploy from this dir with:
#   pnpm --filter @xsec/docs build && npx wrangler pages deploy dist
name = "xsec-docs"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-15"
