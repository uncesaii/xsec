name: "XSEC: Release"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build + release (e.g. v0.15.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: xsec-darwin-arm64
          - os: ubuntu-latest
            asset: xsec-linux-x64
          - os: ubuntu-24.04-arm
            asset: xsec-linux-arm64
          - os: windows-latest
            asset: xsec-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build the CLI dependency closure
        run: pnpm --filter "xsec-cli..." build
      - name: Compile native binary
        shell: bash
        run: bash scripts/bun-compile.sh "" "dist-bin/${{ matrix.asset }}"
      - name: Smoke the binary
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          mv node_modules node_modules.release-build
          trap 'mv node_modules.release-build node_modules; rm -rf "$smoke_dir"' EXIT
          cp "dist-bin/${{ matrix.asset }}" "$smoke_dir/xsec"
          (
            cd "$smoke_dir"
            ./xsec --version
            ./xsec --help | grep -q "security research harness"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist-bin/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-bin
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist-bin
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Create / update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-bin/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" dist-bin/* \
              --repo "${{ github.repository }}" \
              --title "XSEC $TAG" \
              --notes "Automated multi-platform release. See CHANGELOG.md for changes." \
              --verify-tag
          fi
