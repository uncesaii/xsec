name: "XSEC: Installation E2E"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  workflow_run:
    workflows: ["XSEC: Publish Docker image"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: xsec-install-e2e
  cancel-in-progress: true

jobs:
  install:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: ${{ matrix.method }} install
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        method: [binary, source, container]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Exercise documented ${{ matrix.method }} installation
        run: bash scripts/install-e2e.sh ${{ matrix.method }}
