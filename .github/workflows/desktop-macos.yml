name: "XSEC: Desktop macOS"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-macos.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/bun-compile.sh"
      - "scripts/smoke-desktop-macos.sh"
      - "packages/dashboard/**"
      - "packages/desktop/**"
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/db/**"
      - "packages/shared/**"
      - "packages/templates/**"

permissions:
  contents: read

concurrency:
  group: xsec-desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      XSEC_CHATGPT_ACCESS_TOKEN: ""
      XSEC_CHATGPT_OAUTH_REFRESH_TOKEN: ""
      XSEC_CHATGPT_ACCOUNT_ID: ""
      XSEC_CHATGPT_AUTH_FILE: "/tmp/xsec-ci-no-auth.json"
      XSEC_CODEX_AUTH_JSON_PATH: "/tmp/xsec-ci-no-auth.json"
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      QWEN_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      AZURE_OPENAI_API_KEY: ""
      KIMI_API_KEY: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build dashboard and CLI closure
        run: pnpm --filter @xsec/dashboard build && pnpm --filter "xsec-cli..." build
      - name: Build Apple-silicon sidecar
        run: bash scripts/bun-compile.sh "" "dist-bin/xsec-darwin-arm64"
      - name: Build and test desktop boundary
        run: pnpm --filter @xsec/desktop build && pnpm --filter @xsec/desktop test
      - name: Package desktop application
        run: pnpm --filter @xsec/desktop package:mac
      - name: Smoke packaged sidecar
        run: bash scripts/smoke-desktop-macos.sh
      - name: Upload unsigned desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xsec-desktop-macos-arm64
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 7
