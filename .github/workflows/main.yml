name: "XSEC: Main"

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: xsec-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI
        run: pnpm build
      - name: Type-check
        run: pnpm lint
      - name: Smoke CLI
        run: |
          (cd dist && npm install --omit=dev --no-audit --no-fund)
          node dist/xsec.js --help
          bash scripts/smoke-cli.sh "node dist/xsec.js"
      - name: Run tests
        run: pnpm test:public
        env:
          XSEC_CHATGPT_ACCESS_TOKEN: ""
          XSEC_CHATGPT_OAUTH_REFRESH_TOKEN: ""
          XSEC_CHATGPT_ACCOUNT_ID: ""
          XSEC_CHATGPT_AUTH_FILE: "/tmp/xsec-ci-no-auth.json"
          XSEC_CODEX_AUTH_JSON_PATH: "/tmp/xsec-ci-no-auth.json"
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          QWEN_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          AZURE_OPENAI_API_KEY: ""
          KIMI_API_KEY: ""
