name: "XSEC: Dogfood Review"

on:
  workflow_run:
    workflows: ["XSEC: Main"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: xsec-dogfood-review-main
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI
        run: pnpm build
      - name: Smoke CLI
        run: |
          (cd dist && npm install --omit=dev --no-audit --no-fund)
          node dist/xsec.js --help
      - name: Review the merged delta with XSEC
        if: env.OPENAI_API_KEY != ''
        env:
          OPENAI_API_KEY: ${{ secrets.DOGFOOD_OPENAI_API_KEY }}
          XSEC_SELECTED_PROVIDER: openai
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^)"
          node dist/xsec.js review . \
            --diff-base "$base" \
            --changed-only \
            --depth quick \
            --format sarif \
            --db-path "$RUNNER_TEMP/xsec-dogfood.sqlite" \
            > dogfood-review.sarif 2> dogfood-review.stderr || true
          cat dogfood-review.stderr >&2
      - name: Normalize dogfood SARIF
        if: always() && hashFiles('dogfood-review.sarif') != ''
        run: |
          node - dogfood-review.sarif <<'NODE'
          const fs = require("node:fs");
          const path = process.argv[2];
          const sarif = JSON.parse(fs.readFileSync(path, "utf8"));
          for (const run of sarif.runs ?? []) {
            for (const result of run.results ?? []) {
              const physicalLocation = result.locations?.[0]?.physicalLocation;
              if (!physicalLocation) {
                delete result.codeFlows;
                continue;
              }
              for (const flow of result.codeFlows ?? []) {
                for (const thread of flow.threadFlows ?? []) {
                  for (const entry of thread.locations ?? []) {
                    entry.location ??= {};
                    entry.location.physicalLocation ??= physicalLocation;
                  }
                }
              }
            }
          }
          fs.writeFileSync(path, JSON.stringify(sarif));
          NODE
      - name: Upload dogfood SARIF
        if: always() && hashFiles('dogfood-review.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: dogfood-review.sarif
      - name: Preserve dogfood evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xsec-dogfood-review-${{ github.sha }}
          path: |
            dogfood-review.sarif
            dogfood-review.stderr
          if-no-files-found: warn
          retention-days: 14
