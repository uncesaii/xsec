name: "XSEC: Publish Docker image"

on:
  workflow_run:
    workflows: ["XSEC: Main"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: xsec-docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      DOCKER_BUILD_SUMMARY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: |
          set -euo pipefail
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${OWNER}/xsec" >> "$GITHUB_OUTPUT"

      - name: Resolve :latest eligibility
        id: latest_eligible
        run: |
          set -euo pipefail
          CI_SHA="${{ github.event.workflow_run.head_sha }}"
          TIP_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$CI_SHA" = "$TIP_SHA" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ steps.latest_eligible.outputs.enabled }}
          labels: |
            org.opencontainers.image.title=xsec
            org.opencontainers.image.description=Open-source security research harness for authorized targets
            org.opencontainers.image.source=https://github.com/uncesaii/xsec
            org.opencontainers.image.licenses=MIT OR Apache-2.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=xsec
          cache-to: type=gha,mode=max,scope=xsec
