name: "XSEC: Upstream Sync"

# Checks 0sec-labs/0sec for new commits, release tags, and package updates.
# When upstream has moved ahead:
#   1. Merge upstream into main
#   2. Run post-merge rebrand pass
#   3. Bump version, create release branch + binary
#   4. Create a GitHub Release
#   5. Open PR and merge immediately

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/0sec-labs/0sec.git 2>/dev/null || true
          git fetch upstream

      - name: Check if upstream has new commits or package updates
        id: check
        run: |
          TRACKED=$(cat .upstream-version 2>/dev/null || echo "none")
          echo "Currently tracked: $TRACKED"

          # Find the latest upstream tag
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n1)
          echo "Latest upstream tag: $LATEST_TAG"

          # Find the latest upstream commit on main
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          echo "Upstream SHA: $UPSTREAM_SHA"

          # Check if we already have this commit
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD 2>/dev/null; then
            echo "Upstream is up to date (commit $UPSTREAM_SHA already in main)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream changes detected"

            # Check for new tag
            if [ "$LATEST_TAG" != "$TRACKED" ]; then
              echo "New upstream tag: $LATEST_TAG (was $TRACKED)"
            fi

            # Check for package.json changes on upstream
            UPSTREAM_PKGS=$(git diff HEAD...upstream/main --name-only -- '*/package.json' 'package.json' 2>/dev/null || echo "")
            if [ -n "$UPSTREAM_PKGS" ]; then
              echo "Package updates detected:"
              echo "$UPSTREAM_PKGS"
            fi

            echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # --- Everything below runs only when upstream has moved ahead ---

      - name: Setup pnpm
        if: steps.check.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        if: steps.check.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Merge upstream into main
        if: steps.check.outputs.changed == 'true'
        run: |
          git checkout upstream-tracking
          git merge upstream/main --no-edit
          git checkout main
          git merge upstream-tracking --no-edit

      - name: Post-merge rebrand pass
        if: steps.check.outputs.changed == 'true'
        run: bash scripts/post-merge-rebrand.sh

      - name: Bump version and create release branch
        if: steps.check.outputs.changed == 'true'
        id: version
        run: |
          CURRENT=$(node -p "require('./packages/cli/package.json').version")
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
          TAG="v${NEW_VERSION}"
          BRANCH="release/${TAG}"
          git checkout -b "$BRANCH"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('packages/cli/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "${{ steps.check.outputs.tag }}" > .upstream-version
          git add -A
          git commit -m "chore: bump version to $TAG, track upstream ${{ steps.check.outputs.tag }}"
          git tag "$TAG"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Build the CLI
        if: steps.check.outputs.changed == 'true'
        run: pnpm --filter "xsec-cli..." build

      - name: Compile binary
        if: steps.check.outputs.changed == 'true'
        shell: bash
        run: bash scripts/bun-compile.sh "" "dist-bin/xsec-linux-x64"

      - name: Push release branch and tag
        if: steps.check.outputs.changed == 'true'
        run: |
          git push origin "${{ steps.version.outputs.branch }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release with binary
        if: steps.check.outputs.changed == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NOTES="Automated upstream sync from upstream ${{ steps.check.outputs.tag }}."
          gh release create "$TAG" dist-bin/xsec-linux-x64 \
            --repo "${{ github.repository }}" \
            --title "XSEC $TAG (upstream ${{ steps.check.outputs.tag }})" \
            --notes "$NOTES" \
            --verify-tag
          echo "url=https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_OUTPUT"

      - name: Create PR and merge immediately
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BRANCH="${{ steps.version.outputs.branch }}"
          RELEASE_URL="${{ steps.release.outputs.url }}"
          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --title "chore: sync upstream ${{ steps.check.outputs.tag }} ($TAG)" \
            --body "Automated upstream sync. Upstream: ${{ steps.check.outputs.tag }}, Version: $TAG, Binary: $RELEASE_URL" \
            --base main \
            --head "$BRANCH")
          PR_NUM=$(echo "$PR_URL" | grep -oP '\d+$')
          echo "PR: $PR_URL (#$PR_NUM)"
          gh pr merge "$PR_NUM" --repo "${{ github.repository }}" --merge

      - name: Cleanup remote release branch
        if: steps.check.outputs.changed == 'true'
        run: git push origin --delete "${{ steps.version.outputs.branch }}" 2>/dev/null || true
