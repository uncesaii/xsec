name: "XSEC: Upstream Sync"

# Hourly check for new upstream releases (0sec-labs/0sec). When a new tag is
# detected:
#   1. Merge upstream-tracking into main
#   2. Run post-merge rebrand pass (re-stamp our rebrand on upstream changes)
#   3. Create a release branch with version bump + binary
#   4. Create a GitHub Release with the binary attached
#   5. Open a PR from release branch -> main, then merge it immediately

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream tags
        run: git fetch upstream --tags

      - name: Find latest upstream tag
        id: latest
        run: |
          LATEST=$(git tag -l "v*" --sort=-v:refname | head -n1)
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest upstream tag: $LATEST"

      - name: Read current tracked version
        id: tracked
        run: |
          TRACKED=$(cat .upstream-version 2>/dev/null || echo "none")
          echo "tag=$TRACKED" >> "$GITHUB_OUTPUT"
          echo "Currently tracked: $TRACKED"

      - name: Check if new upstream release
        id: check
        run: |
          if [ "${{ steps.latest.outputs.tag }}" = "${{ steps.tracked.outputs.tag }}" ]; then
            echo "Upstream is up to date (${{ steps.tracked.outputs.tag }})."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream: ${{ steps.latest.outputs.tag }} (was ${{ steps.tracked.outputs.tag }})"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # --- Everything below runs only when a new upstream release exists ---

      - name: Setup pnpm
        if: steps.check.outputs.changed == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        if: steps.check.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Merge upstream into main
        if: steps.check.outputs.changed == 'true'
        run: |
          git checkout upstream-tracking
          git merge upstream/main --no-edit
          git checkout main
          git merge upstream-tracking --no-edit

      - name: Post-merge rebrand pass
        if: steps.check.outputs.changed == 'true'
        run: bash scripts/post-merge-rebrand.sh

      - name: Bump version and create release branch
        if: steps.check.outputs.changed == 'true'
        id: version
        run: |
          CURRENT=$(node -p "require('./packages/cli/package.json').version")
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
          TAG="v${NEW_VERSION}"
          BRANCH="release/${TAG}"
          git checkout -b "$BRANCH"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('packages/cli/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "${{ steps.latest.outputs.tag }}" > .upstream-version
          git add -A
          git commit -m "chore: bump version to $TAG, track upstream ${{ steps.latest.outputs.tag }}"
          git tag "$TAG"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Build the CLI
        if: steps.check.outputs.changed == 'true'
        run: pnpm --filter "xsec-cli..." build

      - name: Compile binary
        if: steps.check.outputs.changed == 'true'
        shell: bash
        run: bash scripts/bun-compile.sh "" "dist-bin/xsec-linux-x64"

      - name: Push release branch and tag
        if: steps.check.outputs.changed == 'true'
        run: |
          git push origin "${{ steps.version.outputs.branch }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release with binary
        if: steps.check.outputs.changed == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NOTES="Automated upstream sync from upstream ${{ steps.latest.outputs.tag }}."
          gh release create "$TAG" dist-bin/xsec-linux-x64 \
            --repo "${{ github.repository }}" \
            --title "XSEC $TAG (upstream ${{ steps.latest.outputs.tag }})" \
            --notes "$NOTES" \
            --verify-tag
          echo "url=https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_OUTPUT"

      - name: Create PR and merge immediately
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BRANCH="${{ steps.version.outputs.branch }}"
          RELEASE_URL="${{ steps.release.outputs.url }}"
          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --title "chore: sync upstream ${{ steps.latest.outputs.tag }} ($TAG)" \
            --body "Automated upstream sync. Upstream: ${{ steps.latest.outputs.tag }}, Version: $TAG, Binary: $RELEASE_URL" \
            --base main \
            --head "$BRANCH")
          PR_NUM=$(echo "$PR_URL" | grep -oP '\d+$')
          echo "PR: $PR_URL (#$PR_NUM)"
          gh pr merge "$PR_NUM" --repo "${{ github.repository }}" --merge

      - name: Cleanup remote release branch
        if: steps.check.outputs.changed == 'true'
        run: git push origin --delete "${{ steps.version.outputs.branch }}" 2>/dev/null || true
